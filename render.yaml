# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Connect your repository to Render -> Blueprints -> New Blueprint Instance
# ==============================================================================
services:
  # Option 1: Docker Web Service (RECOMMENDED for Playwright on Render)
  # Provides 100% pre-configured Chromium & OS libraries with zero missing dependency errors
  - type: web
    name: webook-auto-booker
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
